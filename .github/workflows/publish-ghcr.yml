name: Publish reviewed MCP image to GHCR

# Deliberately manual: image updates must never be published by tag or push.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/meyergru/opnsense-mcp-server:dev
            ghcr.io/meyergru/opnsense-mcp-server:sha-${{ github.sha }}
