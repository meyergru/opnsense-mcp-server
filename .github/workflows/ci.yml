name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Ruff lint (includes bandit security rules)
        run: ruff check src/ tests/
      - name: Ruff format check
        run: ruff format --check src/ tests/
      - name: Type checking (mypy strict)
        run: mypy src/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest -v --tb=short

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install --upgrade "setuptools>=83.0.0"
          pip install -e ".[dev]"
      - name: Dependency vulnerability audit
        run: pip-audit --ignore-vuln CVE-2026-4539  # pygments ReDoS, no fix available, dev-only dep
      - name: Check for hardcoded secrets
        run: ruff check src/ --select S105,S106,S107 --no-fix
      - name: Check for insecure SSL usage
        run: ruff check src/ --select S501 --no-fix


  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build the image
        run: docker build --pull -t opnsense-mcp:ci .
      - name: Start HTTP server and verify mandatory authorization
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name opnsense-mcp-ci \
            --read-only --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            --cap-drop ALL --security-opt no-new-privileges \
            -p 127.0.0.1:18000:8000 \
            -e OPNSENSE_MCP_TRANSPORT=http \
            -e OPNSENSE_MCP_HOST=0.0.0.0 \
            -e OPNSENSE_MCP_PORT=8000 \
            -e OPNSENSE_MCP_AUTH_TOKEN=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            -e OPNSENSE_SITES=lab \
            -e OPNSENSE_LAB_URL=https://192.0.2.1/api \
            -e OPNSENSE_LAB_API_KEY=test-key \
            -e OPNSENSE_LAB_API_SECRET=test-secret \
            opnsense-mcp:ci

          trap 'docker logs opnsense-mcp-ci || true; docker rm -f opnsense-mcp-ci || true' EXIT
          status=000
          for attempt in $(seq 1 30); do
            status=$(curl -s -o /dev/null -w '%{http_code}' \
              --max-time 3 -X POST http://127.0.0.1:18000/mcp \
              -H 'Content-Type: application/json' \
              -H 'Accept: application/json, text/event-stream' \
              -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' || true)
            if [[ "$status" == "401" ]]; then break; fi
            sleep 1
          done
          echo "Unauthenticated request: HTTP $status"
          test "$status" = "401"

          accepted=$(curl -s -o /dev/null -w '%{http_code}' \
            --max-time 5 -X POST http://127.0.0.1:18000/mcp \
            -H 'Authorization: Bearer aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa' \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' || true)
          echo "Authenticated request: HTTP $accepted"
          [[ "$accepted" == "200" || "$accepted" == "400" ]]

      - name: Invalid Compose config is unhealthy without restarting
        shell: bash
        run: |
          set -euo pipefail
          # This reproduces a typo in OPNSENSE_LAB_API_SECRET.
          docker run -d --name opnsense-mcp-invalid-ci \
            --restart unless-stopped \
            --read-only --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            --cap-drop ALL --security-opt no-new-privileges \
            -e OPNSENSE_MCP_TRANSPORT=http \
            -e OPNSENSE_MCP_CONFIG_ERROR_HOLD=true \
            -e OPNSENSE_MCP_AUTH_TOKEN=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            -e OPNSENSE_SITES=lab \
            -e OPNSENSE_LAB_URL=https://192.0.2.1/api \
            -e OPNSENSE_LAB_API_KEY=test-key \
            -e OPNSENSE_LAB_AP_SECRET=test-secret \
            opnsense-mcp:ci
          trap 'docker rm -f opnsense-mcp-invalid-ci || true' EXIT
          sleep 3
          state=$(docker inspect -f '{{.State.Status}}' opnsense-mcp-invalid-ci)
          restarts=$(docker inspect -f '{{.RestartCount}}' opnsense-mcp-invalid-ci)
          logs=$(docker logs opnsense-mcp-invalid-ci 2>&1)
          printf '%s\n' "$logs"
          test "$state" = "running"
          test "$restarts" = "0"
          grep -q 'CONFIGURATION ERROR' <<< "$logs"
          grep -q 'OPNSENSE_LAB_API_SECRET' <<< "$logs"
          grep -q 'OPNSENSE_LAB_AP_SECRET' <<< "$logs"
          grep -q 'MCP server NOT started' <<< "$logs"
          if grep -q Traceback <<< "$logs"; then exit 1; fi
