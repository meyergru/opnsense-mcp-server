# Portainer Stack for dedicated VM "mcp".
# First deployment: publish a reviewed main commit to GHCR, set MCP_IMAGE_SHA
# as a Portainer Stack environment variable to that exact 40-hex commit hash,
# then fill in the target credentials.
# All target settings and tokens deliberately live in this Compose file.
name: opnsense-mcp

services:
  opnsense-mcp:
    image: ghcr.io/meyergru/opnsense-mcp-server:sha-${MCP_IMAGE_SHA:?Set MCP_IMAGE_SHA to the reviewed published commit SHA in Portainer Stack variables}
    restart: unless-stopped
    init: true

    # Bind only to a trusted host interface or limit the port externally.
    ports:
      - "8000:8000"

    environment:
      OPNSENSE_MCP_TRANSPORT: "http"
      # Keep invalidly configured container unhealthy instead of restart-looping.
      # Redeploy after fixing Compose; normal runtime crashes still auto-restart.
      OPNSENSE_MCP_CONFIG_ERROR_HOLD: "true"
      OPNSENSE_MCP_HOST: "0.0.0.0"
      OPNSENSE_MCP_PORT: "8000"
      OPNSENSE_MCP_MAX_RESULT_BYTES: "16384"
      # Global operation policy: true means no configuration changes on any site.
      OPNSENSE_MCP_READ_ONLY: "true"
      # Generate with: openssl rand -hex 32 (64 characters)
      OPNSENSE_MCP_AUTH_TOKEN: ""

      # Add comma-separated aliases; dots in names become underscores in env vars.
      # E.g. opnsense.mgsoft -> OPNSENSE_OPNSENSE_MGSOFT_URL / _API_KEY / _API_SECRET.
      # Avoid aliases that normalize to the same prefix (opnsense.mgsoft vs opnsense_mgsoft).
      OPNSENSE_SITES: "local"
      OPNSENSE_LOCAL_URL: "https://192.168.10.1/api"
      OPNSENSE_LOCAL_API_KEY: ""
      OPNSENSE_LOCAL_API_SECRET: ""
      OPNSENSE_LOCAL_VERIFY_SSL: "true"
      # Optional per-site override (leave unset to inherit global policy):
      # OPNSENSE_LOCAL_READ_ONLY: "true"

    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    user: "65532:65532"
    pids_limit: 128
    mem_limit: 512m

    # Do not let Watchtower silently replace an audited MCP image.
    labels:
      com.centurylinklabs.watchtower.enable: "false"

    # TCP reachability only. It does not prove auth or OPNsense connectivity.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import socket; s=socket.create_connection(('127.0.0.1', 8000), 2); s.close()"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
